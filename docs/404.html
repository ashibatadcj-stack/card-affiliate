  <script>
    // === 旧URLからの自動リダイレクト処理（GitHub Pagesリポジトリ名サブパス時代の遺物URLへの対応） ===
    // 対応パターン:
    //   /card-affiliate/...           → /...        （旧サブパスのプレフィックス除去）
    //   /cards/<slug>.html            → /articles/<slug>.html （旧ディレクトリ名）
    //   /card-affiliate/cards/<slug>  → /articles/<slug>.html
    //   /card-affiliate/index.html    → /
    // 無限ループ防止: sessionStorage で1セッションあたり最大2回までに制限
    (function () {
      try {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var newPath = path;

        // パターン1: /card-affiliate/ プレフィックス除去
        if (newPath.indexOf('/card-affiliate/') === 0) {
          newPath = newPath.replace(/^\/card-affiliate\//, '/');
        }

        // パターン2: /cards/ → /articles/ （旧ディレクトリ名）
        if (newPath.indexOf('/cards/') === 0) {
          newPath = newPath.replace(/^\/cards\//, '/articles/');
        }

        // パターン3: /index.html or 末尾 /index.html → 親ディレクトリ
        if (newPath === '/index.html' || newPath.endsWith('/index.html')) {
          newPath = newPath.slice(0, -'index.html'.length);
        }

        // 無限ループ防止
        var redirectKey = '__404_redirect_count__';
        var count = parseInt(sessionStorage.getItem(redirectKey) || '0', 10);

        if (newPath !== path && count < 2) {
          sessionStorage.setItem(redirectKey, count + 1);
          // 画面表示前に即時リダイレクト
          window.location.replace(newPath + search + hash);
          return; // この後のDOM描画はキャンセルされる
        }
        // 正常着地時はカウンタをクリア
        sessionStorage.removeItem(redirectKey);
      } catch (e) { /* 古いブラウザは何もしない */ }
    })();
  </script>
