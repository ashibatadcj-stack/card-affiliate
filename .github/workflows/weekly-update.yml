name: 週次サイト自動更新

on:
  schedule:
    - cron: '0 1 * * 1'  # 毎週月曜日 午前10時(JST)
  workflow_dispatch:       # 手動実行も可能

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: pip install anthropic python-dotenv

      - name: 新記事を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_articles.py

      - name: SEOファイルを更新
        run: python generate_seo_files.py

      - name: 変更をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "自動更新: $(date '+%Y年%m月%d日') 記事・SEOファイル更新"
          git push
